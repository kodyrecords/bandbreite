<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie – BANDbreite</title>
<meta name="description" content="Fotos von Auftritten und Veranstaltungen mit BANDbreite, der akustischen Coverband aus Hünxe.">
<link rel="canonical" href="https://www.bandbreite-live.de/galerie.html">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>

  :root {
    --bg: #f7ebd6;
    --bg-panel: #f0e2c6;
    --bg-panel-2: #ead9b8;
    --dark: #3a2f2a;
    --tan: #8c6b4f;
    --gold: #ba934f;
    --gold-strong: #9c7940;
    --line: #d1c6b2;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--dark);
    font-family: 'Karla', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    margin: 0;
    color: var(--dark);
  }

  a { color: inherit; }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- Header ---------- */

  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(247, 235, 214, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }

  .site-header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    padding-bottom: 14px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .brand-name {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }

  .brand-name em {
    font-family: 'Alex Brush', cursive;
    font-style: normal;
    font-weight: 400;
    font-size: 1.5rem;
    color: var(--tan);
    margin-left: 1px;
  }

  .brand-place {
    font-size: 0.78rem;
    color: var(--tan);
    margin-left: 2px;
  }

  .site-nav {
    display: flex;
    gap: 28px;
    font-size: 0.95rem;
  }

  .site-nav a {
    text-decoration: none;
    color: var(--tan);
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  .site-nav a:hover {
    color: var(--dark);
  }

  @media (max-width: 560px) {
    .site-nav { gap: 14px; font-size: 0.82rem; }
    .brand-place { display: none; }
  }

  @media (max-width: 400px) {
    .site-nav { gap: 10px; font-size: 0.74rem; }
    .brand-name { font-size: 0.9rem; }
    .brand-name em { font-size: 1.25rem; }
  }

  /* ---------- Gallery intro ---------- */

  .gallery-intro {
    padding: 52px 0 16px;
  }

  .gallery-intro h1 {
    font-size: clamp(2rem, 4.8vw, 2.7rem);
  }

  .gallery-intro p {
    color: var(--tan);
    margin-top: 14px;
    max-width: 52ch;
  }

  /* ---------- Gallery grid ---------- */

  .gallery {
    padding: 24px 0 64px;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .gallery-grid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    background: var(--bg-panel);
    cursor: zoom-in;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.2s ease;
  }

  .gallery-grid img.is-loaded {
    opacity: 1;
  }

  .gallery-grid img:hover {
    transform: scale(1.015);
  }

  .gallery-empty {
    color: var(--tan);
    padding: 40px 0;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 6px;
  }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(24, 18, 15, 0.92);
  }

  .lightbox[hidden] {
    display: none;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 22px;
    background: none;
    border: none;
    color: #f7ebd6;
    font-size: 2.2rem;
    line-height: 1;
    cursor: pointer;
    padding: 6px 10px;
  }

  .lightbox-close:hover {
    color: var(--gold);
  }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--line);
    padding: 30px 0;
  }

  footer .wrap {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  .footer-logo {
    height: 22px;
    width: auto;
    display: block;
    opacity: 0.85;
    justify-self: center;
  }

  footer p {
    margin: 0;
    color: var(--tan);
    font-size: 0.85rem;
    justify-self: start;
  }

  .footer-legal {
    display: flex;
    gap: 16px;
    justify-self: end;
  }

  .footer-legal a {
    color: var(--tan);
    text-decoration: none;
    font-size: 0.85rem;
  }

  .footer-legal a:hover {
    color: var(--dark);
  }

  @media (max-width: 560px) {
    footer .wrap {
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 14px;
    }

    footer p,
    .footer-logo,
    .footer-legal {
      justify-self: center;
    }
  }

</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-name">BAND<em>breite</em></span>
      <span class="brand-place">aus Hünxe</span>
    </a>
    <nav class="site-nav">
      <a href="index.html#sound">Der Sound</a>
      <a href="index.html#repertoire">Repertoire</a>
      <a href="galerie.html">Galerie</a>
      <a href="index.html#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<section class="gallery-intro">
  <div class="wrap">
    <h1>Galerie</h1>
    <p>Impressionen von unseren Auftritten und Veranstaltungen.</p>
  </div>
</section>

<section class="gallery">
  <div class="wrap">
    <div id="gallery-grid" class="gallery-grid"></div>
    <p id="gallery-empty" class="gallery-empty" hidden>Hier entstehen bald neue Fotos – schaut gerne später wieder vorbei.</p>
  </div>
</section>

<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox-close" type="button" aria-label="Schließen">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<footer>
  <div class="wrap">
    <p>© 2026 BANDbreite · Hünxe</p>
    <img class="footer-logo" src="assets/logo-icon.png" alt="BANDbreite Logo-Icon: Gitarre, Herzschlag-Linie und Mikrofon">
    <nav class="footer-legal">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </div>
</footer>

<script>
(function () {
  var grid = document.getElementById('gallery-grid');
  var empty = document.getElementById('gallery-empty');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.hidden = false;
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = '';
  }

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox || e.target.closest('.lightbox-close')) closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  fetch('assets/galerie/manifest.json')
    .then(function (res) { return res.ok ? res.json() : []; })
    .then(function (photos) {
      if (!photos || !photos.length) {
        empty.hidden = false;
        return;
      }
      photos.forEach(function (photo) {
        var img = document.createElement('img');
        img.src = 'assets/galerie/' + photo.file;
        img.alt = 'Foto von BANDbreite';
        img.loading = 'lazy';
        img.addEventListener('load', function () { img.classList.add('is-loaded'); });
        img.addEventListener('click', function () { openLightbox(img.src); });
        grid.appendChild(img);
      });
    })
    .catch(function () {
      empty.hidden = false;
    });
})();
</script>

</body>
</html>
